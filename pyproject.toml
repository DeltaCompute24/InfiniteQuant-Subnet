[project]
name = "sn89-signals"
version = "0.1.0"
description = "InfiniteQuant SN89 — encrypted trading-signal subnet (miner + validator)"
readme = "README.md"
license = { text = "MIT" }
# timelock ships wheels only for CPython 3.7–3.10; 3.11/3.12 fail to resolve
# (see requirements.txt). Pin the interpreter so a fresh `uv sync` can never
# silently land on an unsupported Python.
requires-python = ">=3.10,<3.11"

# Runtime deps for BOTH neurons. Pins mirror requirements.txt.
# bittensor 10.3.0 is REQUIRED: the finney runtime now types netuid as a
# Composite(u16) and 10.2.0 cannot encode it -- metagraph(netuid=89) throws
# "Invalid type for data: 89 ... Composite(u16)" and the validator crash-loops
# at startup. 10.3.0 uses async-substrate-interface 2.x + cyscale (NOT scalecodec).
# cyscale is pinned ==0.3.3: the >=0.3.1,<1.0.0 range would otherwise pull 0.5.0,
# whose scalecodec shim is broken ("cannot import name 'ScaleBytes'"). Do NOT add
# scalecodec back -- async-substrate-interface 2.x aborts import if it is present
# (namespace conflict). Verified: a clean pip install resolves to this exact set
# with no manual steps.
dependencies = [
    "bittensor==10.3.0",
    "bittensor-wallet==4.0.1",
    "async-substrate-interface==2.0.2",
    "cyscale==0.3.3",
    "timelock",
    "timelock_wasm_wrapper",
    "cryptography>=42.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Only a self-hosting miner that uploads to its own S3/R2 bucket needs boto3;
# validators and relay/local-disk miners do not.
miner = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

# Consensus-critical: resolve timelock from the vendored wheels, never PyPI.
# PyPI's timelock_wasm_wrapper tops out at 0.0.2, whose ciphertext format the
# live fleet cannot read (and which cannot read the fleet's). See
# requirements.txt and tools/check_timelock.py.
[tool.uv.sources]
timelock = { path = "vendor/timelock/timelock-0.0.2.dev0-py3-none-any.whl" }
timelock_wasm_wrapper = { path = "vendor/timelock/timelock_wasm_wrapper-0.3.0-cp310-cp310-manylinux_2_34_x86_64.whl" }

[tool.uv]
# This repo is run in place (neurons/ + sn89_signals/ via sys.path), not built
# or published as a wheel — resolve and lock the dependencies only.
package = false
